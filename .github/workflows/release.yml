name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Check that the tag matches manifest.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match manifest version $version"
            exit 1
          fi

      # Lets anyone verify that the release assets were built from this repository:
      # gh attestation verify main.js --repo driekeerJ/obsidian-reading-ruler
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
